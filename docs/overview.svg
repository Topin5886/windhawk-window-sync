<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Resize From Center &amp; Window Sync: the three features</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Panel 1: resize from the center -->
  <rect x="15" y="15" width="280" height="270" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="155" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#24292f">Resize from the center</text>
  <rect x="60" y="110" width="190" height="80" rx="4" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <rect x="60" y="110" width="190" height="14" rx="4" fill="#0969da"/>
  <rect x="60" y="118" width="190" height="6" fill="#0969da"/>
  <rect x="100" y="128" width="110" height="58" rx="3" fill="none" stroke="#57606a" stroke-dasharray="5 4"/>
  <text x="155" y="205" text-anchor="middle" font-size="11" fill="#8c959f">dashed: starting size</text>
  <line x1="155" y1="135" x2="155" y2="182" stroke="#8c959f" stroke-dasharray="3 3"/>
  <line x1="100" y1="158" x2="68" y2="158" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="158" x2="242" y2="158" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M250,150 l0,17 l4,-4 l3,7 l3,-1.5 l-3,-7 l5.5,0 z" fill="#24292f" stroke="#ffffff" stroke-width="1"/>
  <text x="155" y="226" text-anchor="middle" font-size="13" fill="#57606a">Both sides move together,</text>
  <text x="155" y="244" text-anchor="middle" font-size="13" fill="#57606a">the center stays put</text>
  <text x="155" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#0969da">Hold Alt while dragging</text>

  <!-- Panel 2: same size -->
  <rect x="310" y="15" width="280" height="270" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="450" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#24292f">One size for every window</text>
  <rect x="330" y="72" width="60" height="40" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <rect x="330" y="72" width="60" height="9" rx="3" fill="#afb8c1"/>
  <rect x="338" y="124" width="88" height="56" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <rect x="338" y="124" width="88" height="9" rx="3" fill="#afb8c1"/>
  <rect x="326" y="192" width="72" height="36" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <rect x="326" y="192" width="72" height="9" rx="3" fill="#afb8c1"/>
  <line x1="440" y1="150" x2="474" y2="150" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="488" y="72" width="82" height="46" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="488" y="72" width="82" height="9" rx="3" fill="#0969da"/>
  <rect x="488" y="128" width="82" height="46" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="488" y="128" width="82" height="9" rx="3" fill="#0969da"/>
  <rect x="488" y="184" width="82" height="46" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="488" y="184" width="82" height="9" rx="3" fill="#0969da"/>
  <text x="450" y="252" text-anchor="middle" font-size="13" fill="#57606a">All take the active window's size</text>
  <text x="450" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#0969da">Win + Alt + S</text>

  <!-- Panel 3: stack behind -->
  <rect x="605" y="15" width="280" height="270" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="745" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#24292f">Stack behind the active one</text>
  <line x1="632" y1="72" x2="660" y2="96" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="858" y1="72" x2="830" y2="96" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="632" y1="232" x2="660" y2="210" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="858" y1="232" x2="830" y2="210" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <rect x="650" y="114" width="190" height="76" rx="4" fill="#eaeef2" stroke="#8c959f"/>
  <rect x="685" y="86" width="120" height="132" rx="4" fill="#eaeef2" stroke="#8c959f"/>
  <rect x="670" y="105" width="150" height="94" rx="4" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <rect x="670" y="105" width="150" height="14" rx="4" fill="#0969da"/>
  <rect x="670" y="113" width="150" height="6" fill="#0969da"/>
  <circle cx="745" cy="158" r="3.5" fill="#0969da"/>
  <text x="745" y="252" text-anchor="middle" font-size="13" fill="#57606a">Every window lines up on its center</text>
  <text x="745" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#0969da">Win + Alt + T</text>
</svg>
